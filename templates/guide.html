<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ guide.title }}</title>
  <style>
    :root {
      --scale-factor: 1rem;
      --bg-page: #F0F4F8;
      --bg-card: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #475569;
      --primary-navy: #1E3A8A;
      --primary-hover: #1E40AF;
      --border-color: #CBD5E1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(191, 219, 254, 0.5) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(203, 213, 225, 0.4) 0%, transparent 50%),
        radial-gradient(#CBD5E1 0.9px, transparent 0.9px);
      background-size: 100% 100%, 100% 100%, 26px 26px;
      color: var(--text-main); 
      font-size: var(--scale-factor);
      line-height: 1.6;
    }

    .top-sticky-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(240, 244, 248, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 2px dashed var(--border-color);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 820px;
      margin: 0 auto;
    }

    .back-link-top {
      color: var(--primary-navy);
      text-decoration: none;
      font-weight: 700;
      font-size: calc(var(--scale-factor) * 0.95);
      background: #EFF6FF;
      border: 1.5px solid #93C5FD;
      padding: 8px 16px;
      border-radius: 12px;
      transition: all 0.2s;
    }
    .back-link-top:hover { background: #DBEAFE; }

    .text-resize-bar { display: flex; gap: 8px; align-items: center; }
    .btn-size {
      background: #ffffff; 
      border: 2px solid #93C5FD; 
      padding: 6px 14px;
      border-radius: 12px; 
      font-weight: 800; 
      cursor: pointer; 
      color: var(--primary-navy);
      font-size: calc(var(--scale-factor) * 1rem); 
    }
    .btn-size:hover { border-color: var(--primary-navy); background: #EFF6FF; }

    .container { max-width: 820px; margin: 35px auto; padding: 0 20px; text-align: center; }
    
    .page-title { 
      font-size: calc(var(--scale-factor) * 2.2); 
      font-weight: 800; 
      color: var(--primary-navy); 
      margin-bottom: 35px; 
      position: relative;
      display: inline-block;
    }
    
    .page-title::after {
      content: '';
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: -8px;
      height: 4px;
      background: #93C5FD;
      border-radius: 2px;
    }

    .step-card {
      background: var(--bg-card); 
      border: 2px solid var(--border-color); 
      border-radius: 20px;
      padding: 32px; 
      margin-bottom: 32px; 
      text-align: left;
      box-shadow: 0 10px 28px rgba(30, 58, 138, 0.05);
    }

    .step-card.has-image {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
      align-items: center;
    }

    .step-header-title { 
      font-size: calc(var(--scale-factor) * 1.4); 
      font-weight: 800; 
      color: var(--primary-navy); 
      margin-bottom: 12px; 
    }

    .step-text { 
      font-size: calc(var(--scale-factor) * 1.15); 
      font-weight: 600; 
      line-height: 1.65; 
      color: var(--text-muted); 
      margin-bottom: 22px; 
    }

    .btn-audio {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--primary-navy); color: white; border: none; 
      padding: 14px 24px; border-radius: 14px; font-weight: 700; 
      cursor: pointer; font-size: calc(var(--scale-factor) * 1rem); 
      transition: all 0.2s ease;
    }
    .btn-audio:hover { background: var(--primary-hover); }
    .btn-audio.speaking { background: #DC2626; }

    .gallery-grid {
      display: flex; gap: 16px; overflow-x: auto;
      justify-content: center;
    }
    .gallery-img-container { 
      width: 240px;
      background: #1C1E21;
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      border: 2px solid #374151;
    }
    
    .screenshot { 
      width: 100%; 
      height: 380px; 
      object-fit: cover; 
      background: #F8FAFC; 
      border-radius: 16px; 
      display: block;
    }

    .image-placeholder {
      width: 100%;
      height: 380px;
      background: #EFF6FF;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--primary-navy);
      font-weight: 700;
      text-align: center;
      padding: 20px;
      font-size: calc(var(--scale-factor) * 0.9);
      border: 2px dashed #93C5FD;
    }

    .footer-logos { display: flex; justify-content: center; gap: 24px; font-size: 1.8rem; margin: 45px 0; opacity: 0.8; }

    @media (max-width: 700px) {
      .step-card.has-image { grid-template-columns: 1fr; }
      .step-card { padding: 22px; }
    }
  </style>
</head>
<body>

  <div class="top-sticky-bar">
    <a href="/apps/{{ lang }}" class="back-link-top">{{ data.back_btn }}</a>
    <div class="text-resize-bar">
      <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">Text:</span>
      <button class="btn-size" onclick="changeFontSize(-1)">A-</button>
      <button class="btn-size" onclick="changeFontSize(1)">A+</button>
    </div>
  </div>

  <div class="container">
    <h1 class="page-title">{{ guide.title }}</h1>

    <div id="stepsContainer">
      {% for step in guide.steps %}
        <div class="step-card {% if step.images %}has-image{% endif %}">
          <div class="step-info">
            <div class="step-header-title">{{ step.title }}</div>
            <p class="step-text">{{ step.text }}</p>

            {% if step.speech %}
              <button class="btn-audio" data-speech="{{ step.speech }}" onclick="toggleReadAloud(this)">
                {{ data.read_aloud_btn }}
              </button>
            {% endif %}
          </div>
          
          {% if step.images %}
            <div class="gallery-grid">
              {% for img_name in step.images %}
                <div class="gallery-img-container">
                  <img src="{{ url_for('static', filename=img_name) }}" 
                       class="screenshot" 
                       alt="Step screenshot"
                       onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                  
                  <div class="image-placeholder" style="display: none;">
                    <span>📱</span>
                    <span style="margin-top: 8px;">Screenshot:<br>{{ img_name }}</span>
                  </div>
                </div>
              {% endfor %}
            </div>
          {% endif %}
        </div>
      {% endfor %}
    </div>

    <div class="footer-logos">
      <span>📘</span>
      <span>💬</span>
      <span>📸</span>
      <span>💜</span>
      <span>📞</span>
    </div>
  </div>

  <script>
    let currentScale = 1.0;

    function changeFontSize(direction) {
      currentScale += direction * 0.1;
      if (currentScale < 1.0) currentScale = 1.0;
      if (currentScale > 1.5) currentScale = 1.5;
      document.documentElement.style.setProperty('--scale-factor', currentScale + 'rem');
    }

    function toggleReadAloud(btn) {
      if (!('speechSynthesis' in window)) {
        alert("Text-to-speech is not supported on this browser.");
        return;
      }

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        resetAllAudioButtons();
        return;
      }

      const textToSpeak = btn.getAttribute('data-speech');
      let utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = "{{ 'ne-NP' if lang == 'np' else 'en-US' }}";
      utterance.rate = 0.85; 

      resetAllAudioButtons();
      btn.classList.add('speaking');
      btn.innerHTML = "⏹ {{ 'बन्द गर्नुहोस्' if lang == 'np' else 'Stop Audio' }}";

      utterance.onend = () => resetAllAudioButtons();
      utterance.onerror = () => resetAllAudioButtons();

      window.speechSynthesis.speak(utterance);
    }

    function resetAllAudioButtons() {
      document.querySelectorAll('.btn-audio').forEach(button => {
        button.classList.remove('speaking');
        button.innerHTML = "{{ data.read_aloud_btn }}";
      });
    }
  </script>

</body>
</html>
