<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ guide.title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background-color: #f6f8f4; color: #1e3a2b; font-size: 16px; }

    .container { max-width: 720px; margin: 40px auto; padding: 0 20px; text-align: center; animation: floatUp 0.6s ease-out; }
    .page-title { font-size: 2.5rem; font-weight: 800; color: #234833; margin-bottom: 20px; }

    .text-resize-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
    .btn-size {
      background: #ffffff; border: 2px solid #cfd9cd; padding: 8px 18px;
      border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: all 0.2s;
    }
    .btn-size:hover { border-color: #3f684c; background: #e8efe6; }

    .step-card {
      background: #ffffff; border: 2px solid #e1e8df; border-radius: 20px;
      padding: 25px; margin-bottom: 30px; text-align: left;
      box-shadow: 0 6px 18px rgba(0,0,0,0.03); transition: transform 0.3s ease;
      animation: floatUp 0.8s ease-out;
    }
    .step-card:hover { transform: translateY(-3px); }

    .step-header-title { font-size: 1.4rem; font-weight: 800; color: #234833; margin-bottom: 12px; }
    .step-text { font-size: 1.2rem; font-weight: 600; line-height: 1.6; color: #344e3d; margin-bottom: 15px; }

    .btn-audio {
      display: inline-flex; align-items: center; gap: 8px;
      background: #3f684c; color: white; border: none; padding: 10px 22px;
      border-radius: 25px; font-weight: 700; cursor: pointer; font-size: 1rem; margin-bottom: 20px; transition: background 0.2s;
    }
    .btn-audio:hover { background: #2d4f38; }

    /* Screenshots Gallery Layout */
    .gallery-grid {
      display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px;
      scroll-snap-type: x mandatory;
    }
    .gallery-img-container { flex: 0 0 240px; scroll-snap-align: start; text-align: center; }
    .screenshot { width: 100%; height: 380px; object-fit: contain; background: #f0f4ef; border-radius: 12px; border: 1px solid #dce5da; }

    .btn-back-container { margin: 30px 0; }
    .btn-back { display: inline-block; background: #e8efe6; color: #234833; padding: 12px 28px; border-radius: 30px; text-decoration: none; font-weight: 700; transition: all 0.2s; }
    .btn-back:hover { background: #d6e2d3; }

    .footer-logos { display: flex; justify-content: center; gap: 20px; font-size: 2rem; margin-top: 30px; opacity: 0.8; }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="page-title">{{ guide.title }}</h1>

    <div class="text-resize-bar">
      <button class="btn-size" onclick="changeFontSize(2)">A+</button>
      <button class="btn-size" onclick="changeFontSize(-2)">A-</button>
    </div>

    <div id="stepsContainer">
      {% for step in guide.steps %}
        <div class="step-card">
          <div class="step-header-title">{{ step.title }}</div>
          <p class="step-text">{{ step.text }}</p>

          <button class="btn-audio" onclick="readAloud(`{{ step.speech }}`)">{{ data.read_aloud_btn }}</button>
          
          <div class="gallery-grid">
            {% for img_name in step.images %}
              <div class="gallery-img-container">
                <img src="{{ url_for('static', filename=img_name) }}" class="screenshot" onerror="this.onerror=null; this.src='https://placehold.co/240x380/e8efe6/2d5a3f?text=Step+Screenshot';">
              </div>
            {% endfor %}
          </div>
        </div>
      {% endfor %}
    </div>

    <div class="btn-back-container">
      <a href="/apps/{{ lang }}" class="btn-back">{{ data.back_btn }}</a>
    </div>

    <div class="footer-logos">
      <span>📘</span>
      <span>💬</span>
      <span>📸</span>
      <span>💜</span>
      <span>📞</span>
    </div>
  </div>

  <script>
    function readAloud(text) {
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "{{ 'ne-NP' if lang == 'nepali' else 'en-US' }}";
      utterance.rate = 0.9; // Slightly slower for clear elderly listening
      window.speechSynthesis.speak(utterance);
    }

    let currentSize = 16;
    function changeFontSize(delta) {
      currentSize += delta;
      if (currentSize < 12) currentSize = 12;
      if (currentSize > 26) currentSize = 26;
      document.body.style.fontSize = currentSize + "px";
    }
  </script>

</body>
</html>
